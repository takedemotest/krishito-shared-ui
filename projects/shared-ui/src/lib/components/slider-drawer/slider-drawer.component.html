@if (isOpen) {
  <div class="slider-drawer-ui" (click)="toggleSliderDrawer()" [ngClass]="position">
    <div class="drawer-content"
      [style.width]="position === 'left' || position === 'right' ? width : '100%'"
      [style.height]="position === 'top' || position === 'bottom' ? width : '100%'"
      (click)="$event.stopPropagation()">
      <div class="drawer-header">
        <h5>{{ title }}</h5>
        <button class="ui-close-x" (click)="toggleSliderDrawer()">✕</button>
      </div>
      <div class="drawer">
        <ng-content></ng-content>
      </div>
    </div>
  </div>
}
